<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1eb">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Демонстрация поиска номеров в «Береге Радости». Выберите даты и посмотрите, когда номер свободен полностью или частично.">
  <title>Поиск номеров · Берег Радости</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <header class="masthead"><a href="./" class="brand">Берег Радости</a><span>Форос · Крым</span></header>
  <main>
    <div class="cover">
      <img src="./assets/photo-1507525428034-b723cf961d3e.webp" alt="">
      <div><p>Демонстрация поиска</p><h1>Наши номера</h1></div>
    </div>
    <form class="search" method="get">
      <div class="intro"><h2>Даты поездки</h2><p>Демосезон · апрель — июнь 2027</p></div>
      <label>Дата заезда<input type="date" name="checkIn" min="2027-04-01" max="2027-06-30" value="2027-04-21" required></label>
      <label>Дата выезда<input type="date" name="checkOut" min="2027-04-02" max="2027-07-01" value="2027-04-29" required></label>
      <button class="action" type="submit">Найти номер <span aria-hidden="true">↗</span></button>
    </form>
    <div class="results-head"><p id="summary" role="status"></p><a href="?checkIn=2027-04-21&amp;checkOut=2027-04-29">Пример 21–29 апреля</a></div>
    <div id="results"></div>
    <noscript>Для интерактивного поиска включите JavaScript в браузере.</noscript>
  </main>
  <footer><span class="brand">Берег Радости</span><span>Даты и цены демонстрационные. Приём заявок отключён.</span></footer>
  <dialog aria-labelledby="room-title" id="room-dialog">
    <div class="dialog-head"><h2 id="room-title"></h2><button id="close-dialog" type="button" aria-label="Закрыть календарь">×</button></div>
    <p id="room-stay"></p>
    <div class="legend"><span>Свободно</span><span>Занято</span><span>Выбрано</span></div>
    <div id="months"></div>
  </dialog>
</body>
</html>
